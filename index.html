<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng sinh nhật 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff5f8;--card:#ffffff;--ink:#4a2338;--muted:#8a5a72;--pink:#ff6fa5;--pink2:#ffb3d1;--gold:#ffc857;--shadow:0 10px 30px rgba(255,111,165,.22);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1019;--card:#2b1825;--ink:#ffe9f2;--muted:#e0aac3;--shadow:0 10px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#1d1019;--card:#2b1825;--ink:#ffe9f2;--muted:#e0aac3;--shadow:0 10px 30px rgba(0,0,0,.5)}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;overflow-x:hidden}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
section{max-width:960px;margin:0 auto;padding:56px 20px}
h2{font-family:'Pacifico',cursive;font-weight:400;font-size:2rem;text-align:center;color:var(--pink);margin:0 0 28px}
.hero{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 20%,var(--pink2),transparent 60%)}
.hero .tag{letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-size:.85rem}
.hero h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(2.4rem,9vw,4.8rem);margin:.2em 0;color:var(--pink);text-shadow:0 4px 18px rgba(255,111,165,.35)}
.hero .name{font-size:clamp(1.4rem,5vw,2.2rem);font-weight:700}
.avatar{width:170px;height:170px;border-radius:50%;border:6px solid var(--card);box-shadow:var(--shadow);object-fit:cover;background:linear-gradient(135deg,var(--pink2),var(--gold));display:flex;align-items:center;justify-content:center;font-size:4rem;margin-bottom:18px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}
.btn{border:0;cursor:pointer;background:linear-gradient(135deg,var(--pink),#ff9a6f);color:#fff;font:700 1rem 'Nunito',sans-serif;padding:13px 28px;border-radius:999px;box-shadow:var(--shadow);transition:transform .2s}
.btn:hover{transform:scale(1.06)}
.cake{text-align:center}
.cake .stage{font-size:5rem;line-height:1;position:relative;display:inline-block;margin-bottom:12px}
.flame{position:absolute;top:-.5em;left:50%;transform:translateX(-50%);font-size:2rem;animation:flick .5s infinite alternate;transition:opacity .4s}
.flame.off{opacity:0}
@keyframes flick{to{transform:translateX(-50%) scale(1.15) rotate(4deg)}}
.cake p{color:var(--muted);margin:.4em 0 18px;min-height:1.6em}
.msg{background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow);text-align:center;font-size:1.1rem;max-width:640px;margin:0 auto}
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:24px}
.wish{background:var(--card);border-radius:20px;padding:22px;box-shadow:var(--shadow);text-align:center}
.wish b{display:block;font-size:2rem}
.gallery{columns:3 220px;column-gap:14px}
.ph{break-inside:avoid;margin:0 0 14px;border-radius:18px;overflow:hidden;box-shadow:var(--shadow);cursor:zoom-in;background:var(--card);transition:transform .25s}
.ph:hover{transform:scale(1.03) rotate(-.6deg)}
.ph img{display:block;width:100%;height:auto}
.ph .ph-empty{aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--pink2),var(--pink))}
.ph:nth-child(2n) .ph-empty{aspect-ratio:1/1;background:linear-gradient(135deg,var(--gold),#ff9a6f)}
.ph .ph-empty span{font-size:2.4rem}
.lb{position:fixed;inset:0;background:rgba(20,5,14,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:88vh;border-radius:14px}
.foot{text-align:center;color:var(--muted);padding:30px 20px 50px}
.reveal{opacity:0;transform:translateY(24px);transition:all .8s}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<header class="hero">
  <div class="avatar" id="avatar">🎀</div>
  <div class="tag">Hôm nay là ngày của</div>
  <h1>Happy Birthday!</h1>
  <div class="name" id="name"></div>
  <p id="sub" style="color:var(--muted);margin:.6em 0 1.4em"></p>
  <button class="btn" onclick="burst()">🎉 Bấm vào đây nhé</button>
</header>

<section class="cake reveal">
  <h2>Thổi nến ước điều ước</h2>
  <div class="stage">🎂<span class="flame" id="flame">🔥</span></div>
  <p id="cakeTxt">Nhắm mắt lại, ước một điều thật đẹp…</p>
  <button class="btn" id="blow">🌬️ Thổi nến</button>
</section>

<section class="reveal">
  <h2>Lời chúc dành cho bạn</h2>
  <div class="msg" id="message"></div>
  <div class="wishes" id="wishes"></div>
</section>

<section class="reveal">
  <h2>Khoảnh khắc đáng nhớ</h2>
  <div class="gallery" id="gallery"></div>
</section>

<div class="foot" id="foot"></div>
<div class="lb" id="lb" onclick="this.classList.remove('on')"><img id="lbimg" alt=""></div>

if(CONFIG.avatar){$('avatar').innerHTML='';$('avatar').style.background='none';const i=new Image();i.src=CONFIG.avatar;i.className='avatar';i.style.margin='0';$('avatar').replaceWith(i);}
$('message').textContent=CONFIG.message;
$('wishes').innerHTML=CONFIG.wishes.map(w=>`<div class="wish"><b>${w.icon}</b><h3 style="margin:.3em 0;color:var(--pink)">${w.title}</h3><div style="color:var(--muted)">${w.text}</div></div>`).join('');
$('foot').textContent='Với tất cả yêu thương, '+CONFIG.from+' 💌';

const g=$('gallery');
const list=CONFIG.photos.length?CONFIG.photos:[null,null,null,null,null,null];
list.forEach((src,i)=>{
  const d=document.createElement('div');d.className='ph';
  if(src){const im=new Image();im.src=src;im.alt='Ảnh '+(i+1);im.loading='lazy';d.appendChild(im);
    d.onclick=()=>{$('lbimg').src=src;$('lb').classList.add('on')};}
  else d.innerHTML='<div class="ph-empty"><span>📷</span>Ảnh '+(i+1)+'</div>';
  g.appendChild(d);
});

/* hiệu ứng xuất hiện khi cuộn */
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in')}),{threshold:.15});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* confetti */
const cv=$('fx'),cx=cv.getContext('2d');let P=[],run=false;
function fit(){cv.width=innerWidth;cv.height=innerHeight}fit();addEventListener('resize',fit);
const COLORS=['#ff6fa5','#ffc857','#ffb3d1','#ff9a6f','#a78bfa','#6ee7b7'];
function burst(){
  for(let i=0;i<140;i++)P.push({x:cv.width/2,y:cv.height*.4,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,s:Math.random()*7+4,c:COLORS[i%COLORS.length],r:Math.random()*6,l:1});
  if(!run){run=true;tick()}
}
function tick(){
  cx.clearRect(0,0,cv.width,cv.height);
  P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.vx*=.99;p.r+=.2;p.l-=.008;
    cx.save();cx.globalAlpha=Math.max(p.l,0);cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
  P=P.filter(p=>p.l>0&&p.y<cv.height+20);
  if(P.length)requestAnimationFrame(tick);else{run=false;cx.clearRect(0,0,cv.width,cv.height)}
}
$('blow').onclick=()=>{
  $('flame').classList.add('off');
  $('cakeTxt').textContent='Điều ước của bạn sẽ thành sự thật! 💫';
  burst();
};
setTimeout(burst,600);
</script>
</body>
</html>
